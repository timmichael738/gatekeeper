# Two gateway replicas sharing rate-limit state through Redis, in front of a demo upstream.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  upstream:
    image: traefik/whoami:latest
    command: ['--port', '9000']

  gateway-1: &gateway
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      GATEKEEPER_CONFIG: /config/gatekeeper.yaml
    volumes:
      - ./docker/gatekeeper.yaml:/config/gatekeeper.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '8081:8080'

  gateway-2:
    <<: *gateway
    ports:
      - '8082:8080'
